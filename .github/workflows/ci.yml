name: Test and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: choco install ffmpeg --no-progress -y
      - run: python -m pip install -r native/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.test.js
      - run: powershell -NoProfile -File install.ps1 -CheckOnly -Language en
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-source-package
          path: dist/*
